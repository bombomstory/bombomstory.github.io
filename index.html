<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณคาร์บอนเครดิตป่าไม้ (ภาคสนาม)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-green-100 self-start">
        
        <div class="bg-green-700 text-white p-5 flex items-center shadow-md">
            <svg class="w-7 h-7 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <h1 class="text-xl font-semibold tracking-wide">คำนวณนิเวศวิทยาป่าไม้</h1>
        </div>

        <div id="formSection" class="p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-5 text-center bg-green-50 py-2 rounded-lg text-green-800">📍 บันทึกข้อมูลพรรณไม้ใหม่</h2>
            
            <form id="treeForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ประเภทป่า (Forest Type)</label>
                    <select id="forestType" class="w-full border-2 border-gray-200 rounded-xl p-3 bg-white focus:ring-green-500 focus:border-green-500 outline-none transition text-base">
                        <option value="deciduous">ป่าเต็งรัง / ป่าเบญจพรรณ</option>
                        <option value="moist_evergreen">ป่าดิบชื้น</option>
                        <option value="dry_evergreen">ป่าดิบแล้ง</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ชนิดพรรณไม้ (Species)</label>
                    <input type="text" id="species" placeholder="เช่น ไม้สัก, ยางนา" class="w-full border-2 border-gray-200 rounded-xl p-3 outline-none focus:border-green-500 transition text-base" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">DBH (cm)</label>
                        <input type="number" step="0.01" id="dbh" placeholder="ขนาดเส้นผ่านศูนย์กลาง" class="w-full border-2 border-gray-200 rounded-xl p-3 outline-none focus:border-green-500 transition text-base" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">ความสูง (m)</label>
                        <input type="number" step="0.01" id="height" placeholder="ความสูงทั้งหมด" class="w-full border-2 border-gray-200 rounded-xl p-3 outline-none focus:border-green-500 transition text-base" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 mt-6 text-lg">
                    💾 ประมวลผลข้อมูล
                </button>
            </form>
        </div>

        <div id="resultSection" class="p-6 hidden bg-gray-50 border-t border-gray-200 h-full">
            <div class="text-center mb-6">
                <span class="inline-block bg-green-100 text-green-800 text-sm px-4 py-1.5 rounded-full font-bold mb-3 shadow-sm">✅ คำนวณเสร็จสิ้น</span>
                <h3 class="font-bold text-2xl text-gray-800 mb-1" id="resSpecies"></h3>
                <p class="text-sm text-gray-600 bg-white inline-block px-3 py-1 rounded-lg border border-gray-200">DBH: <span id="resDbh" class="font-semibold"></span> cm | H: <span id="resH" class="font-semibold"></span> m</p>
            </div>

            <div class="space-y-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500">
                    <h4 class="font-bold text-green-700 mb-3 text-lg flex items-center">🌿 มวลชีวภาพ (Biomass)</h4>
                    <div class="flex justify-between items-center text-base mb-2"><span class="text-gray-600">มวลชีวภาพเหนือพื้นดิน:</span> <span class="font-bold text-gray-800 text-lg"><span id="resAgb"></span> kg</span></div>
                    <div class="flex justify-between items-center text-base"><span class="text-gray-600">มวลชีวภาพใต้พื้นดิน:</span> <span class="font-bold text-gray-800 text-lg"><span id="resBgb"></span> kg</span></div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <h4 class="font-bold text-blue-700 mb-3 text-lg flex items-center">☁️ คาร์บอนและการดูดซับ</h4>
                    <div class="flex justify-between items-center text-base mb-2"><span class="text-gray-600">ปริมาณคาร์บอนที่กักเก็บ:</span> <span class="font-bold text-gray-800 text-lg"><span id="resCarbon"></span> kgC</span></div>
                    <div class="flex justify-between items-center text-base"><span class="text-gray-600">การดูดซับ CO2:</span> <span class="font-black text-blue-600 text-xl"><span id="resCo2"></span> kgCO2eq</span></div>
                </div>
            </div>

            <button type="button" id="btnBack" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition-all mt-8 text-lg">
                ➕ บันทึกต้นต่อไป
            </button>
        </div>

    </div>

    <script>
        document.getElementById('treeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('forestType').value;
            const species = document.getElementById('species').value;
            const D = parseFloat(document.getElementById('dbh').value);
            const H = parseFloat(document.getElementById('height').value);
            
            const D2H = Math.pow(D, 2) * H;
            let Ws = 0, Wb = 0, Wl = 0;

            if (type === 'deciduous') {
                Ws = 0.0396 * Math.pow(D2H, 0.933);
                Wb = 0.00349 * Math.pow(D2H, 1.030);
                Wl = Math.pow((28.0 / (Ws + Wb) + 0.025), -1);
            } else if (type === 'moist_evergreen') {
                Ws = 0.0396 * Math.pow(D2H, 0.9326);
                Wb = 0.006003 * Math.pow(D2H, 1.027);
                Wl = Math.pow((28.0 / (Ws + Wb) + 0.025), -1);
            } else if (type === 'dry_evergreen') {
                Ws = 0.0509 * Math.pow(D2H, 0.919);
                Wb = 0.00893 * Math.pow(D2H, 0.977);
                Wl = 0.0140 * Math.pow(D2H, 0.669);
            }

            const AGB = Ws + Wb + Wl;
            const BGB = AGB * 0.24;
            const TotalBiomass = AGB + BGB;
            const Carbon = TotalBiomass * 0.47;
            const CO2eq = Carbon * 3.667;

            const formatNum = (num) => num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            document.getElementById('resSpecies').innerText = species;
            document.getElementById('resDbh').innerText = formatNum(D);
            document.getElementById('resH').innerText = formatNum(H);
            
            document.getElementById('resAgb').innerText = formatNum(AGB);
            document.getElementById('resBgb').innerText = formatNum(BGB);
            document.getElementById('resCarbon').innerText = formatNum(Carbon);
            document.getElementById('resCo2').innerText = formatNum(CO2eq);

            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            window.scrollTo(0, 0);
        });

        document.getElementById('btnBack').addEventListener('click', function() {
            document.getElementById('species').value = '';
            document.getElementById('dbh').value = '';
            document.getElementById('height').value = '';
            
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
